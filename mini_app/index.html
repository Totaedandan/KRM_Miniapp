      const text = bcText.trim();
      if (!text) { toast('Введите текст рассылки'); return; }
      if (!window.confirm(`Отправить это сообщение ВСЕМ пользователям бота? Действие нельзя отменить.`)) return;
      setBcSending(true);
      try {
        const res = await api('/api/admin/broadcast', { method:'POST', body: JSON.stringify({ text }) });
        toast(`Рассылка запущена: ${res.total} получателей`);
        setBcText('');
      } catch(e) { toast('Ошибка: '+e.message); } finally { setBcSending(false); }
    };
    return (
      <div className="screen">
        <Back/><h2 style={{marginBottom:6}}>Рассылка</h2>
        <p style={{marginBottom:14,color:'var(--txt2)',fontSize:13}}>Сообщение уйдёт всем не забаненным пользователям бота. Поддерживается HTML-разметка Telegram.</p>
        <textarea
          className="textarea"
          value={bcText}
          onChange={e=>setBcText(e.target.value)}
          placeholder="Текст сообщения..."
          rows={8}
          style={{marginBottom:8}}
        />
        <div style={{fontSize:11,color:'var(--txt2)',marginBottom:16,textAlign:'right'}}>{bcText.length} символов</div>
        <button className="btn btn-primary" onClick={send} disabled={bcSending || !bcText.trim()}>{bcSending?'Отправка...':'Отправить всем'}</button>
      </div>
    );
  }

  if (view === 'settings') {
    const saveSetting = async (key, value) => {
      try { await api('/api/admin/settings', { method:'POST', body:JSON.stringify({ key, value }) }); toast('Сохранено'); }
      catch(e) { toast(e.message); }
    };
    const FIELDS = [
      { key:'turnitin_email',     label:'Turnitin Email',    type:'email' },
      { key:'turnitin_password',  label:'Turnitin Пароль',   type:'password' },
      { key:'turnitin_class_id',  label:'Class ID (обычная)',type:'text' },
      { key:'turnitin_assign_id', label:'Assignment ID (обычная)', type:'text' },
      { key:'turnitin_class_id_premium',  label:'Premium Class ID',     type:'text' },
      { key:'turnitin_assign_id_premium', label:'Premium Assignment ID',type:'text' },
      { key:'premium_multiplier', label:'Множитель премиум (×)', type:'text' },
      { key:'kaspi_phone',        label:'Kaspi Телефон',     type:'text' },
      { key:'kaspi_recipient_name', label:'Kaspi Получатель',type:'text' },
      { key:'help_username',      label:'Поддержка @username',type:'text' },
      { key:'help_phone',         label:'Поддержка Телефон', type:'text' },
    ];
    return (
      <div className="screen">
        <Back/><h2 style={{marginBottom:14}}>Настройки</h2>
        {loading ? <Spinner/> : FIELDS.map(f => (
          <div key={f.key} className="setting-row">
            <div className="setting-label">{f.label}</div>
            <div className="adm-row">
              <input className="adm-input" type={f.type} value={settingEdit[f.key]||''} onChange={e=>setSettingEdit(p=>({...p,[f.key]:e.target.value}))}/>
              <button className="btn-sm btn-sm-blue" onClick={()=>saveSetting(f.key,settingEdit[f.key]||'')} style={{display:'flex',alignItems:'center'}}>{React.cloneElement(ICONS.check,{width:16,height:16})}</button>
            </div>
          </div>
        ))}
      </div>
    );
  }

  if (view === 'rental_services') {
    const saveSvc = async () => {
      if (!svcForm.name.trim()) { toast('Введите название'); return; }
      try {
        await api('/api/admin/rental/service', { method:'POST', body: JSON.stringify({
          name: svcForm.name.trim(), icon: svcForm.icon.trim(), description: svcForm.description.trim(),
        })});
        toast('Сервис добавлен'); setSvcForm({ name:'', icon:'', description:'' }); await loadRentSvcs();
      } catch(e) { toast('Ошибка: '+e.message); }
    };
    const toggleSvc = async (s) => {
      try {
        await api('/api/admin/rental/service', { method:'POST', body: JSON.stringify({
          id: s.id, name: s.name, icon: s.icon, description: s.description,
          is_active: !s.is_active, sort_order: s.sort_order,
        })});
        await loadRentSvcs();
      } catch(e) { toast('Ошибка: '+e.message); }
    };
    const saveTariff = async (svcId) => {
      const h = parseInt(tariffForm.hours), p = parseFloat(tariffForm.price);
      if (!tariffForm.name.trim() || !h || !p) { toast('Название, часы и цена обязательны'); return; }
      try {
        await api('/api/admin/rental/tariff', { method:'POST', body: JSON.stringify({
          service_id: svcId, name: tariffForm.name.trim(), duration_hours: h, price: p,
        })});
        toast('Тариф добавлен'); setTariffForm({ svc:null, name:'', hours:'', price:'' }); await loadRentSvcs();
      } catch(e) { toast('Ошибка: '+e.message); }
    };
    const toggleTariff = async (t) => {
      try {
        await api('/api/admin/rental/tariff', { method:'POST', body: JSON.stringify({
          id: t.id, service_id: t.service_id, name: t.name, duration_hours: t.duration_hours,
          price: t.price, is_active: !t.is_active, sort_order: t.sort_order,
        })});
        await loadRentSvcs();
      } catch(e) { toast('Ошибка: '+e.message); }
    };
    const deleteSvc = async (s) => {
      if (!window.confirm(`Удалить сервис «${s.name}» из каталога?`)) return;
      try { await api('/api/admin/rental/service/delete', { method:'POST', body: JSON.stringify({ id:s.id }) }); toast('Удалён'); await loadRentSvcs(); }
      catch(e) { toast('Ошибка: '+e.message); }
    };
    const deleteTariff = async (t) => {
      if (!window.confirm(`Удалить тариф «${t.name}»?`)) return;
      try { await api('/api/admin/rental/tariff/delete', { method:'POST', body: JSON.stringify({ id:t.id }) }); toast('Удалён'); await loadRentSvcs(); }
      catch(e) { toast('Ошибка: '+e.message); }
    };
    return (
      <div className="screen">
        <Back/><h2 style={{marginBottom:14}}>Аренда: каталог</h2>
        <div className="sec-title">Новый сервис</div>
        <div className="adm-row">
          <input className="adm-input" placeholder="Название (ChatGPT Plus)" value={svcForm.name} onChange={e=>setSvcForm(f=>({...f,name:e.target.value}))}/>
          <input className="adm-input" placeholder="openai / 🤖" style={{maxWidth:110,textAlign:'center'}} value={svcForm.icon} onChange={e=>setSvcForm(f=>({...f,icon:e.target.value}))}/>
        </div>
        <div className="adm-row">
          <input className="adm-input" placeholder="Описание (короткое)" value={svcForm.description} onChange={e=>setSvcForm(f=>({...f,description:e.target.value}))}/>
          <button className="btn-sm btn-sm-green" onClick={saveSvc}>Добавить</button>
        </div>
        {loading ? <Spinner/> : rentSvcs.map(s => (
          <div key={s.id} className="card" style={{padding:14,opacity: s.is_active?1:.55}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
              <RentIcon icon={s.icon} size={20}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:15}}>{s.name}</div>
                <div style={{fontSize:11,color:'var(--txt2)'}}>свободно {s.cnt_free} · аренда {s.cnt_rented} · ремонт {s.cnt_maintenance}{s.waiting?` · ждут ${s.waiting}`:''}</div>
              </div>
              <button className={`btn-sm ${s.is_active?'btn-sm-gray':'btn-sm-green'}`} onClick={()=>toggleSvc(s)}>{s.is_active?'Скрыть':'Вкл'}</button>
              <button className="btn-sm btn-sm-red" onClick={()=>deleteSvc(s)}>Удалить</button>
            </div>
            {(s.tariffs||[]).map(t => (
              <div key={t.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 0',borderTop:'1px solid var(--card-b)',fontSize:13,opacity:t.is_active?1:.5}}>
                <span>{t.name} · {durationLabel(t.duration_hours)}</span>
                <span style={{display:'flex',alignItems:'center',gap:8}}>
                  <b>{fmt(t.price)} ₸</b>
                  <button className="btn-sm btn-sm-gray" style={{padding:'4px 8px',fontSize:11}} onClick={()=>toggleTariff(t)}>{t.is_active?'Выкл':'Вкл'}</button>
                  <button className="btn-sm btn-sm-red" style={{padding:'4px 8px',fontSize:11}} onClick={()=>deleteTariff(t)}>{React.cloneElement(ICONS.trash,{width:13,height:13})}</button>
                </span>
              </div>
            ))}
            {tariffForm.svc === s.id ? (
              <div className="adm-row" style={{marginTop:8,marginBottom:0}}>
                <input className="adm-input" placeholder="6 часов" value={tariffForm.name} onChange={e=>setTariffForm(f=>({...f,name:e.target.value}))}/>
                <input className="adm-input" type="number" placeholder="ч" style={{maxWidth:58}} value={tariffForm.hours} onChange={e=>setTariffForm(f=>({...f,hours:e.target.value}))}/>
                <input className="adm-input" type="number" placeholder="₸" style={{maxWidth:74}} value={tariffForm.price} onChange={e=>setTariffForm(f=>({...f,price:e.target.value}))}/>
                <button className="btn-sm btn-sm-green" onClick={()=>saveTariff(s.id)}>{React.cloneElement(ICONS.check,{width:15,height:15})}</button>
              </div>
            ) : (
              <button className="btn-sm btn-sm-blue" style={{marginTop:8}} onClick={()=>setTariffForm({ svc:s.id, name:'', hours:'', price:'' })}>+ Тариф</button>
            )}
          </div>
        ))}
        {!loading && rentSvcs.length === 0 && <p className="empty">Сервисов пока нет</p>}
      </div>
    );
  }

  if (view === 'rental_accounts') {
    const accs = rentSvcSel ? rentAccs.filter(a => a.service_id === rentSvcSel) : rentAccs;
    const svcName = (id) => (rentSvcs.find(s => s.id === id) || {}).name || `#${id}`;
    const proxyLabel = (id) => {
      if (!id) return 'без прокси';
      const p = proxies.find(x => x.id === id);
      return p ? `${p.proxy_url.replace(/^https?:\/\//,'').split('@').pop()} (${p.accounts_count}/${p.max_accounts})` : `#${id}`;
    };
    const addAcc = async () => {
      if (!rentSvcSel) { toast('Сначала выберите сервис'); return; }
      if (!accForm.email.trim()) { toast('Email обязателен'); return; }
      try {
        await api('/api/admin/ai/accounts', { method:'POST', body: JSON.stringify({
          service_id: rentSvcSel, email: accForm.email.trim(),
          proxy_id: accForm.proxy_id ? parseInt(accForm.proxy_id) : null,
        })});
        toast('Аккаунт добавлен'); setAccForm({ email:'', proxy_id:'' });
        await Promise.all([loadRentAccs(), loadRentSvcs()]);
      } catch(e) { toast('Ошибка: '+e.message); }
    };
    const setStatus = async (a, status) => {
      try {
        await api('/api/admin/ai/accounts/update', { method:'POST', body: JSON.stringify({ id:a.id, status })});
        toast(status === 'available' ? 'В пуле (waitlist уведомлён)' : 'Обновлено');
        await Promise.all([loadRentAccs(), loadRentSvcs()]);
      } catch(e) { toast('Ошибка: '+e.message); }
    };
    const forceLogout = async (a) => {
      try {
        await api('/api/admin/ai/accounts/force_logout', { method:'POST', body: JSON.stringify({ id:a.id })});
        toast('Разлогин запущен в фоне — статус обновится через 1-2 минуты');
      } catch(e) { toast('Ошибка: '+e.message); }
    };
    const delAcc = async (a) => {
      if (!window.confirm(`Удалить аккаунт ${a.email}?`)) return;
      try {
        await api('/api/admin/ai/accounts/delete', { method:'POST', body: JSON.stringify({ id:a.id })});
        toast('Удалён'); await Promise.all([loadRentAccs(), loadRentSvcs()]);
      } catch(e) { toast('Ошибка: '+e.message); }
    };
    const ACC_TAG = {
      available:['Свободен','tag-green'], rented:['Арендован','tag-blue'],
      cooldown:['Остывает','tag-yellow'], maintenance:['Ремонт','tag-yellow'],
      disabled:['Выключен','tag-gray'], banned:['Забанен','tag-red'],
    };
    return (
      <div className="screen">
        <Back/><h2 style={{marginBottom:14}}>Аренда: склад</h2>
        <div className="pill-row">
          {rentSvcs.map(s => (
            <button key={s.id} className={`pill ${rentSvcSel===s.id?'on':''}`} style={{display:'inline-flex',alignItems:'center',gap:6}} onClick={()=>setRentSvcSel(rentSvcSel===s.id?null:s.id)}>
              <RentIcon icon={s.icon} size={14}/> {s.name} · {s.cnt_free}
            </button>
          ))}
        </div>
        {rentSvcSel && <>
          <div className="adm-row">
            <input className="adm-input" placeholder="Email (login@домен)" value={accForm.email} onChange={e=>setAccForm(f=>({...f,email:e.target.value}))}/>
          </div>
          <div className="adm-row">
            <select className="adm-input" style={{flex:1}} value={accForm.proxy_id} onChange={e=>setAccForm(f=>({...f,proxy_id:e.target.value}))}>
              <option value="">Без прокси</option>
              {proxies.map(p => <option key={p.id} value={p.id} disabled={p.accounts_count>=p.max_accounts}>
                {proxyLabel(p.id)}{p.accounts_count>=p.max_accounts?' — занят':''}
              </option>)}
            </select>
            <button className="btn-sm btn-sm-green" onClick={addAcc}>Добавить</button>
          </div>
        </>}
        {loading ? <Spinner/> : accs.map(a => {
          const [lbl, cls] = ACC_TAG[a.status] || [a.status,'tag-gray'];
          return (
            <div key={a.id} className="card" style={{padding:'12px 14px'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:14,wordBreak:'break-all'}}>{a.email}</div>
                  <div style={{fontSize:12,color:'var(--txt2)',marginTop:2}}>
                    {proxyLabel(a.proxy_id)} {!rentSvcSel && `· ${svcName(a.service_id)}`}
                  </div>
                </div>
                <span className={`tag ${cls}`}>{lbl}</span>
              </div>
              <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:9}}>
                {a.status !== 'rented' && <>
                  {a.status !== 'available' && <button className="btn-sm btn-sm-green" onClick={()=>setStatus(a,'available')}>Свободен</button>}
                  {a.status !== 'maintenance' && <button className="btn-sm btn-sm-gray" onClick={()=>setStatus(a,'maintenance')}>В ремонт</button>}
                  <button className="btn-sm btn-sm-blue" onClick={()=>forceLogout(a)}>Вылогинить</button>
                  <button className="btn-sm btn-sm-red" onClick={()=>delAcc(a)}>Удалить</button>
                </>}
                {a.status === 'rented' && <span style={{fontSize:12,color:'var(--txt2)'}}>Аренда #{a.current_order_id} — отмена в «Аренда: активные»</span>}
              </div>
            </div>
          );
        })}
        {!loading && accs.length === 0 && <p className="empty">{rentSvcSel ? 'Склад пуст — добавьте аккаунты' : 'Выберите сервис или добавьте его в каталоге'}</p>}
      </div>
    );
  }

  if (view === 'rental_proxies') {
    const addProxy = async () => {
      if (!proxyForm.proxy_url.trim()) { toast('Введите proxy_url'); return; }
      try {
        await api('/api/admin/ai/proxies', { method:'POST', body: JSON.stringify({
          proxy_url: proxyForm.proxy_url.trim(), max_accounts: parseInt(proxyForm.max_accounts)||3,
        })});
        toast('Прокси добавлен'); setProxyForm({ proxy_url:'', max_accounts:3 }); await loadProxies();
      } catch(e) { toast('Ошибка: '+e.message); }
    };
    const delProxy = async (p) => {
      if (!window.confirm(`Удалить прокси ${p.proxy_url}?`)) return;
      try {
        await api('/api/admin/ai/proxies/delete', { method:'POST', body: JSON.stringify({ id:p.id })});
        toast('Удалён'); await loadProxies();
      } catch(e) { toast('Ошибка: '+e.message); }
    };
    return (
      <div className="screen">
        <Back/><h2 style={{marginBottom:4}}>Аренда: прокси</h2>
        <p style={{marginBottom:14}}>2-3 аккаунта на 1 ISP-прокси — очередь разлогина не долбит один IP параллельно</p>
        <div className="adm-row">
          <input className="adm-input" placeholder="http://user:pass@ip:port" value={proxyForm.proxy_url} onChange={e=>setProxyForm(f=>({...f,proxy_url:e.target.value}))}/>
          <input className="adm-input" type="number" placeholder="макс. аккаунтов" style={{maxWidth:100}} value={proxyForm.max_accounts} onChange={e=>setProxyForm(f=>({...f,max_accounts:e.target.value}))}/>
          <button className="btn-sm btn-sm-green" onClick={addProxy}>Добавить</button>
        </div>
        {loading ? <Spinner/> : proxies.map(p => (
          <div key={p.id} className="order-row">
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,fontSize:14,wordBreak:'break-all'}}>{p.proxy_url}</div>
              <div className="order-meta">занято {p.accounts_count} / {p.max_accounts}</div>
            </div>
            <button className="btn-sm btn-sm-red" onClick={()=>delProxy(p)} disabled={p.accounts_count>0}>Удалить</button>
          </div>
        ))}
        {!loading && proxies.length === 0 && <p className="empty">Прокси пока не добавлены</p>}
      </div>
    );
  }

  if (view === 'rental_orders') {
    const cancelRent = async (r) => {
      if (!window.confirm(`Отменить аренду #${r.id} (${r.service_name}) и вернуть ${fmt(r.amount_tenge)} ₸?`)) return;
      try {
        const d = await api('/api/admin/rental/cancel', { method:'POST', body: JSON.stringify({ order_id: r.id })});
        toast(`Отменено · возврат ${fmt(d.refunded||0)} ₸`); await loadRentOrders();
      } catch(e) { toast('Ошибка: '+e.message); }
    };
    return (
      <div className="screen">
        <Back/><h2 style={{marginBottom:14}}>Аренда: активные</h2>
        {loading ? <Spinner/> : rentOrders.map(r => (
          <div key={r.id} className="order-row">
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,fontSize:14}}>#{r.id} · {r.service_name} · @{r.username||r.user_id}</div>
              <div className="order-meta">{r.email} · <b>{fmt(r.amount_tenge)} ₸</b> · ещё <Countdown expiresAt={r.expires_at}/></div>
            </div>
            <button className="btn-sm btn-sm-red" onClick={()=>cancelRent(r)}>Отменить</button>
          </div>
        ))}
        {!loading && rentOrders.length === 0 && <p className="empty">Активных аренд нет</p>}
      </div>
    );
  }

  if (view === 'rental_otp_logs') {
    return (
      <div className="screen">
        <Back/><h2 style={{marginBottom:14}}>Аренда: OTP-логи</h2>
        {loading ? <Spinner/> : otpLogs.map(l => (
          <div key={l.id} className="order-row">
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,fontSize:14,wordBreak:'break-all'}}>{l.recipient_email}</div>
              <div className="order-meta">{(l.created_at||'').slice(0,16)}</div>
            </div>
            <div style={{fontWeight:800,fontSize:16,letterSpacing:1}}>{l.otp_code}</div>
          </div>
        ))}
        {!loading && otpLogs.length === 0 && <p className="empty">Кодов ещё не приходило</p>}
      </div>
    );
  }

  if (view === 'cleanup') {
    const doClean = async () => {
      setCleaning(true);
      try { const d = await api('/api/admin/cleanup', { method:'POST' }); toast(`Удалено: uploads=${d.deleted_uploads} reports=${d.deleted_reports}`); }
      catch(e) { toast('Ошибка: '+e.message); } finally { setCleaning(false); }
    };
    return (
      <div className="screen">
        <Back/><h2 style={{marginBottom:14}}>Очистка кэша</h2>
        <div className="cleanup-box">
          <p>Закрывает браузер Playwright и удаляет старые файлы. Используйте если Turnitin возвращает старые результаты или растёт Memory Usage в Docker.</p>
          <p style={{marginTop:8,fontSize:13,color:'var(--txt2)'}}>Очередь, бан-лист, статистика и история заказов сохраняются — удаляются только кэш браузера и старые загруженные файлы.</p>
        </div>
        <button className="btn btn-primary" style={{background:'#dc2626',display:'flex',alignItems:'center',justifyContent:'center',gap:8}} onClick={doClean} disabled={cleaning}>
          {cleaning ? <><span className="spinner-sm"/> Очищаю…</> : <>{React.cloneElement(ICONS.trash,{width:17,height:17})} Запустить очистку</>}
        </button>
      </div>
    );
  }

  return null;
}

// ── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [tab,    setTab]    = useState('home');
  const [user,   setUser]   = useState(null);
  const [orders, setOrd]    = useState([]);
  const [loading,setLoad]   = useState(true);
  const [toast,  showToast] = useToast();

  const load = useCallback(async () => {
    try {
      const [me, ord] = await Promise.all([api('/api/me'), api('/api/orders')]);
      setUser(me); setOrd(ord.orders || []);
    } catch(e) { showToast('Ошибка загрузки: ' + e.message); }
    finally { setLoad(false); }
  }, []);

  useEffect(() => {
    tg?.ready();
    tg?.expand();
    load();
  }, []);

  // Частичное обновление баланса без полной перезагрузки
  const updateBalance = (patch) => setUser(u => u ? {...u, ...patch} : u);

  // Turnitin и Хуманайзер открываются с карточек Главной — в навбаре их нет
  const TABS = [
    { id:'home',   icon:'home',   label:'Главная' },
    { id:'rental', icon:'key',    label:'Аренда'  },
    { id:'wallet', icon:'wallet', label:'Кошелёк' },
    { id:'profile',icon:'user',   label:'Профиль' },
    ...(user?.is_admin ? [{ id:'admin', icon:'shield', label:'Админ' }] : []),
  ];
  const navActive = ({ turnitin:'home', humanizer:'home' })[tab] || tab;

  if (loading) return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh'}}><Spinner/></div>;

  return (
    <>
      <Toast msg={toast}/>
      {tab==='home'      && <HomeScreen     user={user} orders={orders} onNav={setTab}/>}
      {tab==='turnitin'  && <TurnitinScreen user={user} prices={user?.prices} premiumMult={user?.premium_multiplier||1.5} onNav={setTab} onBalanceUpdate={updateBalance}/>}
      {tab==='humanizer' && <HumanizerScreen user={user} onNav={setTab} onBalanceUpdate={b => updateBalance({token_balance:b})}/>}
      {tab==='rental'    && <RentalScreen   user={user} onNav={setTab} onBalanceUpdate={updateBalance}/>}
      {tab==='wallet'    && <WalletScreen   user={user} packages={user?.packages} onRefresh={load} onBalanceUpdate={updateBalance}/>}
      {tab==='profile'   && <ProfileScreen  user={user} orders={orders}/>}
      {tab==='admin'     && <AdminScreen    toast={showToast}/>}
      <nav className="nav">
        {TABS.map(t => (
          <button key={t.id} className={`nav-btn ${navActive===t.id?'active':''}`} onClick={() => setTab(t.id)}>
            {ICONS[t.icon]}
            <span className="nav-label">{t.label}</span>
          </button>
        ))}
      </nav>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
