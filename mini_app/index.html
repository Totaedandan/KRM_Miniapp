<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Turnitin & Humanizer</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --r-sm:   10px;
      --r-lg:   14px;
      --r-xl:   18px;
      --nav-h:  68px;
      /* Выразительные easing-кривые (стандартные CSS слишком вялые) */
      --ease-out:    cubic-bezier(0.23, 1, 0.32, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
      /* Фирменный градиент — ТОЛЬКО для карточки баланса */
      --g1: #6366f1; --g2: #8b5cf6; --g3: #d946ef;
      --grad:   linear-gradient(135deg, var(--g1), var(--g2), var(--g3));
      --grad-2: linear-gradient(135deg, var(--g1), var(--g2));
    }
    [data-theme="dark"] {
      --bg:      #0a0a0c;   /* нейтральный почти-чёрный */
      --bg2:     #111114;   /* инсет-фон внутри карточек */
      --card:    #141418;   /* графитовая карточка */
      --card-b:  rgba(255,255,255,0.07);
      --card-b2: rgba(255,255,255,0.13);
      --txt:     #f4f4f6;
      --txt2:    #8b8b96;
      --txt3:    #5b5b64;
      --accent:    #4f46e5;                  /* индиго — единственный акцент */
      --accent-2:  #a5b4fc;                  /* контрастный акцент для текста/иконок */
      --accent-soft: rgba(99,102,241,0.12);
      --accent-bd:   rgba(99,102,241,0.32);
      --ok:   #34d399; --ok-bg:   rgba(16,185,129,.12);
      --err:  #f87171; --err-bg:  rgba(239,68,68,.12);
      --warn: #fbbf24; --warn-bg: rgba(245,158,11,.12);
      --nav-bg:   rgba(12,12,15,0.92);
      --toast-bg: rgba(22,22,27,.98);
      --sheet-dim: rgba(0,0,0,.6);
    }
    [data-theme="light"] {
      --bg:      #faf6ef;   /* тёплый кремовый */
      --bg2:     #f1ece1;
      --card:    #ffffff;
      --card-b:  rgba(29,27,22,0.08);
      --card-b2: rgba(29,27,22,0.16);
      --txt:     #1d1b16;
      --txt2:    #6f6a60;
      --txt3:    #a39d90;
      --accent:    #4f46e5;
      --accent-2:  #4f46e5;                  /* на светлом сам индиго достаточно контрастен */
      --accent-soft: rgba(79,70,229,0.10);
      --accent-bd:   rgba(79,70,229,0.30);
      --ok:   #047857; --ok-bg:   rgba(16,185,129,.13);
      --err:  #dc2626; --err-bg:  rgba(239,68,68,.10);
      --warn: #b45309; --warn-bg: rgba(245,158,11,.14);
      --nav-bg:   rgba(250,246,239,0.92);
      --toast-bg: rgba(255,255,255,.98);
      --sheet-dim: rgba(29,27,22,.35);
    }
    [data-theme="light"] .tag-blue   { background: rgba(59,130,246,.12);  color: #1d4ed8; }
    [data-theme="light"] .tag-green  { background: rgba(16,185,129,.14);  color: #047857; }
    [data-theme="light"] .tag-red    { background: rgba(239,68,68,.12);   color: #dc2626; }
    [data-theme="light"] .tag-yellow { background: rgba(245,158,11,.16);  color: #b45309; }
    [data-theme="light"] .tag-gray   { background: rgba(107,114,128,.12); color: #4b5563; }
    html, body { height: 100%; background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; color: var(--txt); -webkit-font-smoothing: antialiased; transition: background-color .25s ease, color .25s ease; }
    button { color: var(--txt); font-family: 'Plus Jakarta Sans', sans-serif; }
    #root { height: 100%; display: flex; flex-direction: column; }
    /* Тонкие иконки — премиальный минимализм */
    #root svg { stroke-width: 1.6; }
    .screen { flex: 1; overflow-y: auto; padding: 24px 20px calc(var(--nav-h) + 26px); }

    /* Нижняя навигация: активная вкладка — «пилюля» с названием страницы */
    .nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h); background: var(--nav-bg); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--card-b); display: flex; align-items: center; gap: 6px; padding: 0 12px; z-index: 100; }
    .nav-btn { flex: 1; min-width: 0; height: 46px; display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; border: none; border-radius: 23px; background: transparent; color: var(--txt3); padding: 0; transition: flex-grow .25s var(--ease-out), background-color .25s var(--ease-out), color .25s var(--ease-out); }
    .nav-btn svg { width: 21px; height: 21px; flex-shrink: 0; }
    .nav-btn .nav-label { max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap; font-size: 13px; font-weight: 700; transition: max-width .25s var(--ease-out), opacity .15s ease-out; }
    .nav-btn.active { flex-grow: 2.4; background: var(--accent-soft); color: var(--accent-2); }
    .nav-btn.active .nav-label { max-width: 96px; opacity: 1; transition: max-width .25s var(--ease-out), opacity .2s ease-out .06s; }
    @media (prefers-reduced-motion: reduce) {
      .nav-btn, .nav-btn .nav-label { transition: none; }
    }

    /* Заголовок-имя — акцентный текст (градиент остался только на карточке баланса) */
    .grad { color: var(--accent-2); }

    /* Buttons */
    .btn { display: block; width: 100%; padding: 15px; border-radius: var(--r-lg); border: none; font-family: inherit; font-weight: 600; font-size: 15px; cursor: pointer; transition: background-color .18s ease, opacity .18s ease, transform 160ms var(--ease-out); }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:active { opacity: .92; }
    .btn-secondary { background: transparent; color: var(--accent-2); border: 1px solid var(--accent-bd); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }

    /* Cards */
    .card { background: var(--card); border: 1px solid var(--card-b); border-radius: var(--r-xl); padding: 18px; margin-bottom: 12px; }
    .svc-card { width: 100%; background: var(--card); border: 1px solid var(--card-b); border-radius: var(--r-xl); padding: 18px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 14px; text-align: left; transition: border-color .18s ease, transform 160ms var(--ease-out); }
    .svc-card:active { transform: scale(0.985); border-color: var(--card-b2); }

    /* Check cards (Turnitin types) */
    .check-card { width: 100%; background: var(--card); border: 1px solid var(--card-b); border-radius: var(--r-xl); padding: 18px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: border-color .18s ease, transform 160ms var(--ease-out); }
    .check-card:active { transform: scale(0.985); border-color: var(--accent-bd); }
    .check-card.disabled { opacity: .5; cursor: not-allowed; }

    /* Balance card — фирменный градиент */
    .bal-card { background: var(--grad); border-radius: var(--r-xl); padding: 22px 20px; margin-bottom: 14px; box-shadow: 0 10px 30px -10px rgba(124,58,237,.5); }
    .bal-label { font-size: 11px; font-weight: 600; color: rgba(255,255,255,.85); text-transform: uppercase; letter-spacing: 1px; }
    .bal-amount { font-size: 44px; font-weight: 800; line-height: 1.05; letter-spacing: -1.5px; margin: 8px 0 2px; color: #fff; }
    .bal-sub { font-size: 13px; color: rgba(255,255,255,.8); }
    .bal-tok { background: rgba(255,255,255,.16); border-radius: var(--r-lg); padding: 12px 14px; margin-top: 16px; display: flex; justify-content: space-between; align-items: center; color: #fff; }
    .bal-tok svg { stroke: #fff; }

    /* Topup amounts */
    .topup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .topup-btn { background: var(--card); border: 1px solid var(--card-b); border-radius: var(--r-lg); padding: 15px; cursor: pointer; text-align: center; font-weight: 700; font-size: 16px; color: var(--txt); transition: border-color .18s ease, transform 160ms var(--ease-out); }
    .topup-btn:active { transform: scale(0.97); border-color: var(--accent-bd); }
    .topup-custom { background: var(--card); border: 1px solid var(--card-b); border-radius: var(--r-lg); padding: 8px 8px 8px 16px; display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
    .topup-custom input { flex: 1; background: none; border: none; outline: none; font-family: inherit; font-size: 16px; font-weight: 700; color: var(--txt); }
    .topup-custom input::placeholder { color: var(--txt2); font-weight: 500; }

    /* Token packages */
    .pkg-card { display: block; width: 100%; box-sizing: border-box; background: var(--card); border: 1px solid var(--card-b); border-radius: var(--r-xl); padding: 18px; margin-bottom: 10px; cursor: pointer; transition: border-color .18s ease, transform 160ms var(--ease-out); }
    .pkg-card:active { transform: scale(0.985); border-color: var(--card-b2); }
    .pkg-card.pop { border-color: var(--accent-bd); }
    .pkg-card.disabled { opacity: .5; cursor: not-allowed; }
    .pkg-badge { background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; padding: 3px 9px; border-radius: 6px; display: inline-block; margin-bottom: 8px; }

    /* Humanizer */
    .pill-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .pill { background: transparent; border: 1px solid var(--card-b); border-radius: 10px; padding: 8px 14px; font-size: 13px; font-weight: 600; color: var(--txt2); cursor: pointer; transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
    .pill.on { background: var(--accent-soft); border-color: var(--accent-bd); color: var(--accent-2); }
    .toggle { width: 44px; height: 26px; border-radius: 13px; background: var(--bg2); border: 1px solid var(--card-b); cursor: pointer; position: relative; transition: background .2s; flex-shrink: 0; }
    .toggle.on { background: var(--accent); border-color: var(--accent); }
    .toggle::after { content: ''; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #fff; top: 3px; left: 3px; transition: transform .2s; }
    .toggle.on::after { transform: translateX(18px); }
    .textarea { width: 100%; background: var(--bg2); border: 1px solid var(--card-b); border-radius: var(--r-lg); padding: 14px; font-family: inherit; font-size: 14px; line-height: 1.55; color: var(--txt); resize: none; min-height: 140px; outline: none; transition: border-color .18s; }
    .textarea:focus { border-color: var(--accent-bd); }
    .textarea::placeholder { color: var(--txt3); }
    .result-box { background: var(--bg2); border: 1px solid var(--card-b); border-radius: var(--r-lg); padding: 14px; font-size: 14px; line-height: 1.6; max-height: 280px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
    .file-btn { background: var(--bg2); border: 1px dashed var(--card-b2); border-radius: var(--r-lg); padding: 14px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--txt2); margin-bottom: 10px; width: 100%; transition: border-color .18s ease, color .18s ease, transform 160ms var(--ease-out); }
    .file-btn:active { transform: scale(0.98); }
    /* hover только на устройствах с курсором — на таче тап ложно «зависает» в hover */
    @media (hover: hover) and (pointer: fine) {
      .file-btn:hover { border-color: var(--accent-bd); color: var(--accent-2); }
    }
    .file-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* Orders */
    .order-row { background: var(--card); border: 1px solid var(--card-b); border-radius: var(--r-lg); padding: 13px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
    .order-row svg { width: 16px; height: 16px; }
    .order-id { font-size: 11px; color: var(--txt2); }
    .order-meta { font-size: 12px; color: var(--txt2); margin-top: 2px; }
    .row-ico { width: 36px; height: 36px; background: var(--bg2); border: 1px solid var(--card-b); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--txt2); }

    /* Tag */
    .tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; display: inline-block; }
    .tag-blue   { background: rgba(59,130,246,.13);  color: #60a5fa; }
    .tag-green  { background: rgba(16,185,129,.13);  color: #34d399; }
    .tag-red    { background: rgba(239,68,68,.13);   color: #f87171; }
    .tag-yellow { background: rgba(245,158,11,.13);  color: #fbbf24; }
    .tag-gray   { background: rgba(107,114,128,.12); color: #9ca3af; }

    /* Admin */
    .adm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .adm-tile { background: var(--card); border: 1px solid var(--card-b); border-radius: var(--r-xl); padding: 14px 12px; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; transition: border-color .18s; color: var(--txt); }
    .adm-tile:active { border-color: var(--accent-bd); transform: scale(0.97); }
    .adm-tile-icon { width: 38px; height: 38px; border-radius: 10px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; color: var(--accent-2); flex-shrink: 0; }
    .adm-tile-icon svg { width: 18px; height: 18px; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .stat-box { background: var(--card); border: 1px solid var(--card-b); border-radius: var(--r-lg); padding: 14px; text-align: center; }
    .stat-num { font-size: 28px; font-weight: 900; }
    .stat-lbl { font-size: 11px; color: var(--txt2); margin-top: 2px; }
    .adm-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
    .adm-input { flex: 1; background: var(--bg2); border: 1px solid var(--card-b); border-radius: var(--r-sm); padding: 11px 13px; font-family: inherit; font-size: 14px; color: var(--txt); outline: none; transition: border-color .18s; }
    .adm-input:focus { border-color: var(--accent-bd); }
    .btn-sm { padding: 10px 15px; border-radius: var(--r-sm); border: 1px solid transparent; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: transform 140ms var(--ease-out); }
    .btn-sm:active { transform: scale(0.95); }
    .btn-sm-blue  { background: var(--accent-soft); color: var(--accent-2); border-color: var(--accent-bd); }
    .btn-sm-green { background: var(--ok-bg);  color: var(--ok); }
    .btn-sm-red   { background: var(--err-bg); color: var(--err); }
    .btn-sm-gray  { background: var(--bg2); color: var(--txt2); border-color: var(--card-b); }
    .back-btn { background: none; border: none; color: var(--txt2); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 0; margin-bottom: 16px; }
    .back-btn svg { width: 18px; height: 18px; }
    .price-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .price-label { font-size: 14px; color: var(--txt2); min-width: 140px; }
    .setting-row { margin-bottom: 12px; }
    .setting-label { font-size: 12px; color: var(--txt2); margin-bottom: 4px; }

    /* Misc */
    .copy-btn { background: var(--bg2); border: 1px solid var(--card-b); border-radius: var(--r-sm); padding: 8px 13px; font-size: 12px; font-weight: 600; color: var(--txt2); cursor: pointer; margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; }
    .copy-btn svg { width: 14px; height: 14px; }
    .spinner { width: 30px; height: 30px; border: 2.5px solid var(--card-b); border-top-color: var(--accent-2); border-radius: 50%; animation: spin .8s linear infinite; margin: 40px auto; }
    .spinner-sm { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; vertical-align: -2px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); background: var(--toast-bg); border: 1px solid var(--card-b2); color: var(--txt); padding: 11px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 999; pointer-events: none; box-shadow: 0 8px 28px rgba(0,0,0,.25); max-width: 88%; text-align: center; }
    .empty { text-align: center; color: var(--txt3); padding: 36px 16px; font-size: 14px; }
    .sec-title { font-size: 11px; font-weight: 700; color: var(--txt3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; margin-top: 4px; display: flex; align-items: center; gap: 7px; }
    .sec-title svg { width: 14px; height: 14px; }
    h2 { font-size: 25px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; }
    h3 { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
    p  { font-size: 13px; color: var(--txt2); line-height: 1.55; }
    a  { color: var(--accent-2); text-decoration: none; }
    .insufficient { border-color: var(--err) !important; opacity: .85; }
    .cleanup-box { background: var(--err-bg); border: 1px solid rgba(239,68,68,.22); border-radius: var(--r-lg); padding: 16px; margin-bottom: 14px; }
    .ico-badge { width: 64px; height: 64px; border-radius: 18px; background: var(--accent); display: flex; align-items: center; justify-content: center; color: #fff; margin: 0 auto 16px; }
    .ico-badge svg { width: 30px; height: 30px; }

    /* Theme toggle */
    .theme-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--card-b); background: var(--card); color: var(--txt2); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: transform 160ms var(--ease-out), border-color .18s ease; }
    .theme-btn:active { transform: scale(0.92); }
    .theme-btn svg { width: 18px; height: 18px; }

    /* Поиск в каталоге аренды */
    .search-row { background: var(--card); border: 1px solid var(--card-b); border-radius: var(--r-lg); padding: 0 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 14px; color: var(--txt3); }
    .search-row input { flex: 1; background: none; border: none; outline: none; font-family: inherit; font-size: 14px; color: var(--txt); padding: 13px 0; }
    .search-row input::placeholder { color: var(--txt3); }
    .search-row svg { width: 17px; height: 17px; flex-shrink: 0; }

    /* Карточка сервиса аренды */
    .rent-ico { width: 46px; height: 46px; border-radius: 13px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; color: var(--accent-2); }
    .avail { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 5px; }
    .avail::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .avail-on  { background: var(--ok-bg);  color: var(--ok); }
    .avail-off { background: var(--bg2); color: var(--txt3); }
    .avail-wait{ background: var(--warn-bg); color: var(--warn); }

    /* Bottom-sheet (выбор тарифа / креды) */
    .sheet-dim { position: fixed; inset: 0; background: var(--sheet-dim); z-index: 200; opacity: 0; transition: opacity .25s ease-out; }
    .sheet-dim.open { opacity: 1; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 201; background: var(--card); border-radius: 22px 22px 0 0; border-top: 1px solid var(--card-b); padding: 10px 20px calc(22px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .3s var(--ease-drawer); max-height: 86vh; overflow-y: auto; }
    .sheet.open { transform: translateY(0); }
    .sheet-grip { width: 38px; height: 4px; border-radius: 2px; background: var(--card-b2); margin: 4px auto 16px; }
    @media (prefers-reduced-motion: reduce) {
      .sheet { transition: opacity .2s ease; }
    }

    /* Тариф в шите */
    .tariff-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; background: transparent; border: 1px solid var(--card-b); border-radius: var(--r-lg); padding: 14px 16px; margin-bottom: 8px; cursor: pointer; color: var(--txt); transition: border-color .15s ease, background-color .15s ease, transform 160ms var(--ease-out); }
    .tariff-btn:active { transform: scale(0.98); }
    .tariff-btn.on { background: var(--accent-soft); border-color: var(--accent-bd); }

    /* Креды выданного аккаунта */
    .cred-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--bg2); border: 1px solid var(--card-b); border-radius: var(--r-lg); padding: 12px 14px; margin-bottom: 8px; }
    .cred-val { font-size: 14px; font-weight: 700; word-break: break-all; }
    .cred-lbl { font-size: 11px; color: var(--txt2); margin-bottom: 2px; }

    /* Таймер активной аренды */
    .countdown { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--accent-2); }
  </style>
</head>
<body>
<div id="root"></div>
<script>

function RentIcon({ icon, size = 24 }) {
  const b = BRANDS[icon];
  if (!b) return <span style={{fontSize:size*0.92,lineHeight:1}}>{icon || '🔑'}</span>;
  return (
    <svg viewBox={b.vb} width={size} height={size} style={{flexShrink:0,color:'var(--txt)'}} aria-hidden="true">
      {b.parts.map((p,i) => b.stroke
        ? <path key={i} d={p.d} fill="none" stroke={p.fill||b.fill} strokeWidth={b.stroke} strokeLinecap="round" strokeLinejoin="round"/>
        : <path key={i} d={p.d} fill={p.fill||b.fill}/>)}
    </svg>
  );
}

// ── Helpers ──────────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
  const initData = tg?.initData || '';
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': initData, ...(opts.headers||{}) },
  });
  if (!res.ok) { const e = await res.json().catch(() => ({ detail: res.statusText })); throw new Error(e.detail || 'Error'); }
  return res.json();
}

function fmt(n) { return Number(n || 0).toLocaleString('ru-RU'); }
function fmtT(n) { return (Number(n || 0)).toFixed(1); }

function statusTag(s) {
  const map = { pending:['Ожидание','tag-yellow'], queued:['В очереди','tag-yellow'], awaiting_file:['Ждём файл','tag-yellow'], ready:['Готов к проверке','tag-blue'], processing:['В процессе','tag-blue'], paid:['Оплачено','tag-blue'], done:['Готово','tag-green'], error:['Ошибка','tag-red'], cancelled:['Отменён','tag-gray'], active:['Активна','tag-green'], expired:['Завершена','tag-gray'] };
  const [l,c] = map[s] || [s,'tag-gray'];
  return <span className={`tag ${c}`}>{l}</span>;
}

// «6 ч» / «неделя» / «месяц» / «год»
function durationLabel(h) {
  const map = { 24:'сутки', 168:'неделя', 336:'2 недели', 720:'месяц', 2160:'3 месяца', 4320:'полгода', 8760:'год' };
  return map[h] || `${h} ч`;
}

// Сервер шлёт naive-UTC isoformat — дробную часть отрезаем, 'Z' обязателен,
// иначе таймер уедет на локальный сдвиг (+5ч в Казахстане).
function parseUTC(s) { return new Date(String(s).split('.')[0] + 'Z'); }

function Countdown({ expiresAt }) {
  const [left, setLeft] = useState(() => parseUTC(expiresAt) - Date.now());
  useEffect(() => {
    const t = setInterval(() => setLeft(parseUTC(expiresAt) - Date.now()), 1000);
    return () => clearInterval(t);
  }, [expiresAt]);
  if (left <= 0) return <span className="countdown">0:00</span>;
  const s = Math.floor(left / 1000), d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const txt = d > 0 ? `${d} д ${h} ч` : h > 0 ? `${h} ч ${m} мин` : `${m}:${String(sec).padStart(2,'0')}`;
  return <span className="countdown">{txt}</span>;
}

function ThemeToggle() {
  const [theme, setTheme] = useState(document.documentElement.dataset.theme || 'dark');
  const flip = () => {
    const next = theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
    try {
      const bg = next === 'light' ? '#faf6ef' : '#0a0a0c';
      tg?.setHeaderColor?.(bg); tg?.setBackgroundColor?.(bg);
    } catch (e) {}
    setTheme(next);
  };
  return (
    <button className="theme-btn" onClick={flip} aria-label="Сменить тему">
      {ICONS[theme === 'dark' ? 'sun' : 'moon']}
    </button>
  );
}

function useToast() {
  const [t, setT] = useState(null);
  const show = m => { setT(m); setTimeout(() => setT(null), 2400); };
  return [t, show];
}
const Toast = ({ msg }) => msg ? <div className="toast">{msg}</div> : null;
const Spinner = () => <div className="spinner"/>;

// ── TurnitinScreen ───────────────────────────────────────────────────────────
function TurnitinScreen({ user, prices, premiumMult, onNav, onBalanceUpdate }) {
  const [toast, showToast] = useToast();
  const [loading, setLoading] = useState(false);
  const [success, setSuccess] = useState(null); // { order_id, is_premium }
  const [premium, setPremium] = useState(false);
  const [useBonus, setUseBonus] = useState(true);
  const bonusBal = Number(user?.bonus_balance || 0);
  // Ключ идемпотентности: один на попытку заказа. Сохраняется при ретраях того
  // же заказа (двойной тап / потеря ответа) — сервер не спишет дважды.
  const reqIdRef = useRef(null);
  const mult = Number(premiumMult || 1.5);
  const checks = [
    { type:'sim',  label:'Плагиат',     sub:'Similarity report',  priceKey:'price_sim'  },
    { type:'ai',   label:'AI-детекция', sub:'AI Writing report',  priceKey:'price_ai'   },
    { type:'both', label:'Оба отчёта',  sub:'Sim + AI (выгоднее)',priceKey:'price_both' },
  ];
  const priceFor = (key) => {
    const base = prices?.[key] || 0;
    return premium ? Math.round(base * mult) : base;
  };

  const choose = async (type, price) => {
    const balance   = Number(user?.tenge_balance || 0);
    const spendable = balance + (useBonus ? bonusBal : 0);
    const isWl      = user?.is_whitelisted;
    if (!isWl && spendable < price) {
      showToast(`Нужно ${fmt(price)} ₸, у вас ${fmt(spendable)} ₸`);
      setTimeout(() => onNav('wallet'), 1200);
      return;
    }
    if (loading) return;               // защита от двойного тапа
    setLoading(true);
    if (!reqIdRef.current) {
      reqIdRef.current = (crypto.randomUUID && crypto.randomUUID()) ||
        (Date.now() + '-' + Math.random().toString(36).slice(2));
    }
    try {
      const res = await api('/api/order', { method:'POST', body: JSON.stringify({ report_type: type, is_premium: premium, request_id: reqIdRef.current, use_bonus: useBonus }) });
      reqIdRef.current = null;         // успех — следующий заказ получит новый ключ
      setSuccess({ order_id: res.order_id, is_premium: res.is_premium });
      onBalanceUpdate && onBalanceUpdate({ tenge_balance: res.balance, bonus_balance: res.bonus_balance });
    } catch(e) {
      showToast(e.message);    // ключ сохраняем: ретрай дедуплицируется
    } finally {
      setLoading(false);
    }
  };

  if (success) return (
    <div className="screen" style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'60vh',textAlign:'center'}}>
      <div className="ico-badge">{React.cloneElement(ICONS[success.is_premium ? 'zap' : 'checkc'],{width:30,height:30})}</div>
      <h2 style={{marginBottom:8}}>Заказ #{success.order_id} создан</h2>
      <p style={{marginBottom:24,maxWidth:300}}>
        {success.is_premium
          ? <>Премиум-очередь — мы <b>сейчас же</b> попросим файл в чате бота. У вас будет <b>3 минуты</b> на отправку.</>
          : <>Место в очереди забронировано. Когда подойдёт очередь, бот попросит файл — на отправку даётся <b>3 минуты</b>.</>}
        <br/><br/>Форматы: .pdf · .docx · .doc · .txt · .rtf
      </p>
      <button className="btn btn-primary" style={{width:'auto',padding:'12px 32px'}} onClick={() => setSuccess(null)}>
        Создать ещё
      </button>
    </div>
  );

  return (
    <div className="screen">
      <Toast msg={toast}/>
      <button className="back-btn" onClick={() => onNav('home')}>{ICONS.back} Назад</button>
      <h2 style={{marginBottom:4}}>Turnitin</h2>
      <p style={{marginBottom:16}}>Проверка на плагиат и AI-контент</p>

      <div className="sec-title">Очередь</div>
      <div style={{display:'flex',gap:10,marginBottom:22}}>
        <button onClick={()=>setPremium(false)}
          style={{flex:1,padding:'14px 12px',borderRadius:'var(--r-lg)',border:`1px solid ${!premium?'var(--accent-bd)':'var(--card-b)'}`,background:!premium?'var(--accent-soft)':'transparent',color:'var(--txt)',cursor:'pointer',textAlign:'left',transition:'background-color .15s ease, border-color .15s ease'}}>
          <div style={{fontWeight:700,fontSize:14,display:'flex',alignItems:'center',gap:7}}><Icon name="clock" size={15} color={!premium?'var(--accent-2)':'var(--txt2)'}/> Обычная</div>
          <div style={{fontSize:11,color:'var(--txt2)',marginTop:4}}>дешевле, с ожиданием</div>
        </button>
        <button onClick={()=>setPremium(true)}
          style={{flex:1,padding:'14px 12px',borderRadius:'var(--r-lg)',border:`1px solid ${premium?'var(--accent-bd)':'var(--card-b)'}`,background:premium?'var(--accent-soft)':'transparent',color:'var(--txt)',cursor:'pointer',textAlign:'left',transition:'background-color .15s ease, border-color .15s ease'}}>
          <div style={{fontWeight:700,fontSize:14,display:'flex',alignItems:'center',gap:7}}><Icon name="zap" size={15} color={premium?'var(--accent-2)':'var(--txt2)'}/> Премиум ×{mult}</div>
          <div style={{fontSize:11,color:'var(--txt2)',marginTop:4}}>приоритетное обслуживание</div>
        </button>
      </div>

      {bonusBal > 0 && (
        <div className="adm-row" style={{marginBottom:14,justifyContent:'space-between'}}>
          <span style={{fontSize:13}}>Списать бонусы ({fmt(bonusBal)} ₸)</span>
          <button className={`toggle ${useBonus?'on':''}`} onClick={()=>setUseBonus(v=>!v)}/>
        </div>
      )}

      <div className="sec-title">Выберите тип проверки</div>
      {checks.map(c => {
        const price  = priceFor(c.priceKey);
        const canPay = user?.is_whitelisted || (Number(user?.tenge_balance||0) + (useBonus?bonusBal:0)) >= price;
        return (
          <button key={c.type} className={`check-card ${!canPay ? 'insufficient' : ''}`}
            onClick={() => !loading && choose(c.type, price)} disabled={loading}>
            <div>
              <div style={{fontWeight:700,fontSize:16}}>{c.label}</div>
              <div style={{fontSize:13,color:'var(--txt2)',marginTop:2}}>{c.sub}</div>
            </div>
            <div style={{textAlign:'right'}}>
              <div style={{fontWeight:800,fontSize:18,color: canPay ? 'var(--accent-2)' : 'var(--txt2)'}}>{fmt(price)} ₸</div>
              {!canPay && <div style={{fontSize:11,color:'var(--err)',marginTop:2}}>Мало средств</div>}
            </div>
          </button>
        );
      })}
      {loading && <div style={{textAlign:'center',padding:16,color:'var(--txt2)',fontSize:13}}><span className="spinner-sm"/> Создаю заказ…</div>}
      {(user?.tenge_balance || 0) < Math.min(...checks.map(c => priceFor(c.priceKey)||700)) && !user?.is_whitelisted && (
        <button className="btn btn-secondary" style={{marginTop:16,display:'flex',alignItems:'center',justifyContent:'center',gap:8}} onClick={() => onNav('wallet')}>
          <Icon name="wallet" size={17}/> Пополнить баланс
        </button>
      )}
    </div>
  );
}

function HumanizerScreen({ user, onNav, onBalanceUpdate }) {
  const [text, setText]   = useState('');
  const [tone, setTone]   = useState('College');
  const [mode, setMode]   = useState('Medium');
  const [biz,  setBiz]    = useState(false);
  const [loading, setLoading] = useState(false);
  const [result, setResult]   = useState(null);
  const [toast, showToast]    = useToast();
  const fileRef = useRef();

  const words    = text.trim().split(/\s+/).filter(Boolean).length;
  const cost     = biz ? words * 5 : words * 0.5;
  const isWl     = user?.is_whitelisted;
  const canAfford = isWl || (user?.token_balance || 0) >= cost;

  const TONES = { College:'Студенческий', Casual:'Разговорный', Business:'Деловой' };
  const MODES = { Low:'Мягкий', Medium:'Средний', High:'Агрессивный' };

  const handleFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const ext = file.name.split('.').pop().toLowerCase();
    if (!['txt','docx','doc'].includes(ext)) { showToast('Поддерживаются .txt, .docx, .doc'); return; }
    if (file.size > 10 * 1024 * 1024) { showToast('Файл слишком большой (макс 10 МБ)'); return; }

    if (ext === 'txt') {
      const reader = new FileReader();
      reader.onload = ev => { setText(ev.target.result); showToast('Файл загружен'); };
      reader.readAsText(file);
    } else {
      // docx/doc — отправим на API для извлечения текста
      const fd = new FormData();
      fd.append('file', file);
      try {
        const r = await fetch('/api/extract_text', {
          method: 'POST',
          headers: { 'X-Telegram-Init-Data': tg?.initData || '' },
          body: fd,
        });
        if (r.ok) { const d = await r.json(); setText(d.text || ''); showToast('Файл загружен'); }
        else showToast('Не удалось прочитать файл');
      } catch { showToast('Ошибка загрузки файла'); }
    }
    e.target.value = '';
  };

  const submit = async () => {
    if (words < 10) return;
    setLoading(true); setResult(null);
    try {
      const d = await api('/api/humanize', { method: 'POST', body: JSON.stringify({ text, tone, mode, business: biz }) });
      setResult(d);
      if (onBalanceUpdate) onBalanceUpdate(d.balance);
    } catch(e) { showToast('Ошибка: ' + e.message); }
    finally { setLoading(false); }
  };

  const copy = () => result?.result && navigator.clipboard?.writeText(result.result).then(() => showToast('Скопировано!'));

  return (
    <div className="screen">
      <Toast msg={toast}/>
      <button className="back-btn" onClick={() => onNav('home')}>{ICONS.back} Назад</button>
      <h2 style={{marginBottom:4}}>Хуманайзер</h2>
      <p style={{marginBottom:16}}>Делаю ИИ-тексты неотличимыми от человеческих.</p>

      <div className="card" style={{marginBottom:14}}>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:13}}>
          <span style={{color:'var(--txt2)'}}>Стоимость: <b style={{color:'var(--txt)'}}>{(biz?5:.5).toFixed(1)}/слово</b></span>
          <span style={{color:'var(--txt2)',display:'flex',alignItems:'center',gap:6}}><Icon name="coins" size={14} color="var(--accent-2)"/> Баланс: <b style={{color:'var(--txt)'}}>{fmtT(user?.token_balance)}</b></span>
        </div>
        {words >= 10 && <div style={{marginTop:8,fontSize:13,fontWeight:600,color: canAfford?'var(--ok)':'var(--err)'}}>
          {canAfford ? `Спишется ${cost.toFixed(1)} токенов` : `Не хватает токенов — нужно ${cost.toFixed(1)}`}
        </div>}
      </div>

      <div className="sec-title">Тон</div>
      <div className="pill-row">
        {Object.entries(TONES).map(([k,v]) => (
          <button key={k} className={`pill ${tone===k?'on':''}`} onClick={() => setTone(k)}>{v}</button>
        ))}
      </div>

      <div className="sec-title">Режим</div>
      <div className="pill-row">
        {Object.entries(MODES).map(([k,v]) => (
          <button key={k} className={`pill ${mode===k?'on':''}`} onClick={() => setMode(k)}>{v}</button>
        ))}
      </div>

      <div className="sec-title" style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <span>Бизнес-мод</span>
        <button className={`toggle ${biz?'on':''}`} onClick={() => setBiz(!biz)}/>
      </div>

      <div style={{marginBottom:10}}>
        <button className="file-btn" onClick={() => fileRef.current?.click()}>
          {ICONS.file} Загрузить файл (.txt / .docx / .doc)
          <input ref={fileRef} type="file" accept=".txt,.docx,.doc" style={{display:'none'}} onChange={handleFile}/>
        </button>
        <textarea
          className="textarea"
          placeholder="Или введите / вставьте текст здесь..."
          value={text}
          onChange={e => setText(e.target.value)}
          rows={6}
        />
        <div style={{textAlign:'right',fontSize:12,color:'var(--txt2)',marginTop:4}}>{words} слов</div>
      </div>

      <button className="btn btn-primary" onClick={submit} disabled={words < 10 || (!isWl && !canAfford) || loading} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
        {loading ? <><span className="spinner-sm"/> Обрабатываю…</> : <><Icon name="spark" size={17} color="#fff"/> Хуманизировать</>}
      </button>

      {result && (
        <div style={{marginTop:16}}>
          <div className="sec-title">Результат</div>
          <div className="result-box">{result.result}</div>
          <div style={{display:'flex',gap:8,marginTop:8,flexWrap:'wrap'}}>
            <button className="copy-btn" onClick={copy}>{React.cloneElement(ICONS.copy,{width:14,height:14})} Скопировать</button>
            <span style={{fontSize:12,color:'var(--txt2)',alignSelf:'center'}}>
              {result.words_input}→{result.words_output} слов · −{result.tokens_spent?.toFixed(1)||0} токенов
            </span>
          </div>
        </div>
      )}
    </div>
  );
}

// ── WalletScreen (баланс + пополнение + покупка токенов) ─────────────────────
function WalletScreen({ user, packages, onRefresh, onBalanceUpdate }) {
  const [toast, showToast]     = useToast();
  const [customAmt, setCustomAmt] = useState('');
  const [phoneInput, setPhoneInput] = useState('');
  const [waitingPayment, setWaitingPayment] = useState(null); // {payment_id, amount, phone_number}
  const [pollTimedOut, setPollTimedOut] = useState(false);
  const [loadingTopup, setLoadingTopup] = useState(false);
  const [loadingPkg,   setLoadingPkg]   = useState(null); // index пакета
  const [localUser, setLocalUser]       = useState(user);
  const [promoInput,    setPromoInput]    = useState('');
  const [appliedPromo,  setAppliedPromo]  = useState(null); // {code, percent} — привязан к след. пополнению
  const [applyingPromo, setApplyingPromo] = useState(false);

  // Sync if parent user changes
  React.useEffect(() => setLocalUser(user), [user]);

  const AMOUNTS = [1000, 2000, 5000, 10000];

  const applyTopupResult = (res) => {
    setLocalUser(u => ({ ...u, tenge_balance: res.tenge_balance }));
    onBalanceUpdate && onBalanceUpdate({ tenge_balance: res.tenge_balance });
    showToast('Баланс пополнен!');
    setWaitingPayment(null);
    setPollTimedOut(false);
    setCustomAmt('');
  };

  // Поллинг статуса, пока ждём подтверждения оплаты в Kaspi
  React.useEffect(() => {
    if (!waitingPayment || pollTimedOut) return;
    let attempts = 0;
    const iv = setInterval(async () => {
      attempts++;
      try {
        const res = await api(`/api/topup/status?payment_id=${waitingPayment.payment_id}`);
        if (res.status === 'confirmed') {
          clearInterval(iv);
          applyTopupResult(res);
        } else if (['cancelled', 'expired', 'error'].includes(res.status)) {
          clearInterval(iv);
          showToast('Оплата не прошла — попробуйте снова');
          setWaitingPayment(null);
        } else if (attempts >= 60) {
          clearInterval(iv);
          setPollTimedOut(true);
        }
      } catch (e) { /* сеть моргнула — пробуем на следующем тике */ }
    }, 3000);
    return () => clearInterval(iv);
  }, [waitingPayment, pollTimedOut]);

  const checkTopupNow = async () => {
    if (!waitingPayment) return;
    try {
      const res = await api(`/api/topup/status?payment_id=${waitingPayment.payment_id}`);
      if (res.status === 'confirmed') { applyTopupResult(res); return; }
      if (['cancelled', 'expired', 'error'].includes(res.status)) {
        showToast('Оплата не прошла — попробуйте снова');
        setWaitingPayment(null);
        return;
      }
      setPollTimedOut(false); // ещё pending — перезапустить автополлинг
    } catch (e) { showToast(e.message); }
  };

  const doTopup = async (amount) => {
    const amt = parseFloat(amount);
    if (!amt || amt < 100) { showToast('Минимум 100 ₸'); return; }
    const phone = phoneInput.trim();
    if (!/^87\d{9}$/.test(phone)) { showToast('Номер Kaspi в формате 87001234567'); return; }
    setLoadingTopup(true);
    try {
      const res = await api('/api/topup', { method:'POST', body: JSON.stringify({ amount: amt, phone_number: phone, promo_code: appliedPromo?.code || null }) });
      setWaitingPayment({ payment_id: res.payment_id, amount: res.amount, phone_number: res.phone_number });
      setPollTimedOut(false);
      setAppliedPromo(null);
    } catch(e) {
      showToast(e.message);
    } finally {
      setLoadingTopup(false);
    }
  };

  const applyPromo = async () => {
    const code = promoInput.trim();
    if (!code || applyingPromo) return;
    setApplyingPromo(true);
    try {
      const res = await api('/api/promo/apply', { method:'POST', body: JSON.stringify({ code }) });
      if (res.type === 'fixed') {
        setLocalUser(u => ({ ...u, bonus_balance: res.new_bonus_balance }));
        onBalanceUpdate && onBalanceUpdate({ bonus_balance: res.new_bonus_balance });
        showToast(`Начислено +${fmt(res.bonus)} ₸ на бонусный баланс`);
        setPromoInput('');
      } else {
        setAppliedPromo({ code: res.code, percent: res.percent });
        showToast(`Промокод применён — +${res.percent}% к пополнению`);
        setPromoInput('');
      }
    } catch(e) {
      showToast(e.message);
    } finally {
      setApplyingPromo(false);
    }
  };

  const bonusBal = Number(localUser?.bonus_balance || 0);
  const [useBonusTokens, setUseBonusTokens] = useState(true);

  const buyTokens = async (pkg, idx) => {
    const bal = Number(localUser?.tenge_balance || 0);
    const spendable = bal + (useBonusTokens ? bonusBal : 0);
    if (!localUser?.is_whitelisted && spendable < pkg.tenge) {
      showToast(`Нужно ${fmt(pkg.tenge)} ₸`);
      return;
    }
    setLoadingPkg(idx);
    try {
      const res = await api('/api/buy_tokens', { method:'POST', body: JSON.stringify({ tokens: pkg.tokens, tenge: pkg.tenge, use_bonus: useBonusTokens }) });
      setLocalUser(u => ({ ...u, token_balance: res.new_token_balance, tenge_balance: res.new_tenge_balance, bonus_balance: res.new_bonus_balance }));
      onBalanceUpdate && onBalanceUpdate({ token_balance: res.new_token_balance, tenge_balance: res.new_tenge_balance, bonus_balance: res.new_bonus_balance });
      showToast(`Начислено +${fmt(pkg.tokens)} токенов`);
    } catch(e) {
      showToast(e.message);
    } finally {
      setLoadingPkg(null);
    }
  };

  // Экран ожидания подтверждения оплаты в Kaspi (после создания счёта ApiPay)
  if (waitingPayment) return (
    <div className="screen">
      <div style={{textAlign:'center',marginBottom:24,marginTop:16}}>
        <div className="ico-badge">{React.cloneElement(ICONS.card,{width:30,height:30})}</div>
        <h2 style={{marginBottom:8}}>Подтвердите оплату</h2>
        <p style={{marginBottom:0}}>{fmt(waitingPayment.amount)} ₸ · номер {waitingPayment.phone_number}</p>
      </div>
      <div className="card" style={{background:'rgba(99,102,241,0.08)',borderColor:'rgba(99,102,241,0.3)',marginBottom:20,textAlign:'center',padding:'20px 16px'}}>
        {pollTimedOut ? (
          <>
            <p style={{color:'var(--txt)',fontSize:13,lineHeight:1.6,marginBottom:14}}>
              Оплата ещё обрабатывается. Если вы уже подтвердили в Kaspi — подождите немного и проверьте снова.
            </p>
            <button className="btn btn-primary" onClick={checkTopupNow}>Проверить снова</button>
          </>
        ) : (
          <>
            <Spinner/>
            <p style={{color:'var(--txt)',fontSize:13,lineHeight:1.6,marginTop:14}}>
              Откройте приложение <b>Kaspi.kz</b> на номере <b>{waitingPayment.phone_number}</b> и подтвердите платёж.<br/>
              Баланс пополнится автоматически.
            </p>
          </>
        )}
      </div>
      <button className="btn-sm btn-sm-gray" style={{width:'100%',justifyContent:'center'}} onClick={() => { setWaitingPayment(null); setPollTimedOut(false); }}>
        Отменить
      </button>
    </div>
  );

  return (
    <div className="screen">
      <Toast msg={toast}/>
      <h2 style={{marginBottom:16}}>Кошелёк</h2>

      <div className="bal-card">
        <div className="bal-label">Баланс</div>
        <div className="bal-amount">{fmt(localUser?.tenge_balance)} ₸</div>
        <div className="bal-sub">Используется для Turnitin и покупки токенов</div>
        {bonusBal > 0 && (
          <div className="bal-tok">
            <span style={{fontSize:13,fontWeight:600,display:'flex',alignItems:'center',gap:7}}>🎁 Бонусы</span>
            <span style={{fontSize:16,fontWeight:800}}>{fmt(bonusBal)} ₸</span>
          </div>
        )}
        <div className="bal-tok">
          <span style={{fontSize:13,fontWeight:600,display:'flex',alignItems:'center',gap:7}}><Icon name="coins" size={15} color="var(--accent-2)"/> Токены Хуманайзера</span>
          <span style={{fontSize:16,fontWeight:800}}>{fmtT(localUser?.token_balance)}</span>
        </div>
      </div>

      <div className="sec-title">Пополнить баланс (₸)</div>
      <div className="topup-custom" style={{marginBottom:10}}>
        <input
          type="tel"
          placeholder="Телефон Kaspi: 87001234567"
          value={phoneInput}
          onChange={e => setPhoneInput(e.target.value.replace(/[^\d]/g,'').slice(0,11))}
        />
      </div>
      <div className="topup-grid">
        {AMOUNTS.map(a => (
          <button key={a} className="topup-btn" onClick={() => doTopup(a)} disabled={loadingTopup}>
            {fmt(a)} ₸
          </button>
        ))}
      </div>
      <div className="topup-custom">
        <input
          type="number"
          placeholder="Другая сумма..."
          value={customAmt}
          onChange={e => setCustomAmt(e.target.value)}
        />
        <button className="btn-sm btn-sm-blue" onClick={() => doTopup(customAmt)} disabled={loadingTopup}>
          {loadingTopup ? '...' : 'Пополнить'}
        </button>
      </div>
      <p style={{marginBottom:14,fontSize:12}}>
        Придёт уведомление в приложении Kaspi — подтвердите платёж, баланс зачислится автоматически.
      </p>

      <div className="topup-custom">
        <input
          type="text"
          placeholder="Промокод"
          value={promoInput}
          onChange={e => setPromoInput(e.target.value.toUpperCase())}
          onKeyDown={e => e.key === 'Enter' && applyPromo()}
        />
        <button className="btn-sm btn-sm-blue" onClick={applyPromo} disabled={applyingPromo || !promoInput.trim()}>
          {applyingPromo ? '...' : 'Применить'}
        </button>
      </div>
      {appliedPromo && (
        <div className="card" style={{background:'rgba(34,197,94,0.08)',borderColor:'rgba(34,197,94,0.3)',marginTop:10,padding:'10px 14px',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
          <span style={{fontSize:13}}>🎁 Промокод <b>{appliedPromo.code}</b> — +{appliedPromo.percent}% к следующему пополнению</span>
          <button onClick={() => setAppliedPromo(null)} style={{background:'none',border:'none',color:'var(--txt2)',fontSize:16,cursor:'pointer',padding:'0 4px',flexShrink:0}}>✕</button>
        </div>
      )}
      <div style={{marginBottom:20}}/>

      <div className="sec-title">Купить токены Хуманайзера</div>
      {bonusBal > 0 && (
        <div className="adm-row" style={{marginBottom:10,justifyContent:'space-between'}}>
          <span style={{fontSize:13}}>Списать бонусы ({fmt(bonusBal)} ₸)</span>
          <button className={`toggle ${useBonusTokens?'on':''}`} onClick={()=>setUseBonusTokens(v=>!v)}/>
        </div>
      )}
      {(packages || []).map((pkg, i) => {
        const canPay = localUser?.is_whitelisted || (Number(localUser?.tenge_balance||0) + (useBonusTokens?bonusBal:0)) >= pkg.tenge;
        const isLoading = loadingPkg === i;
        return (
          <button key={i} className={`pkg-card ${i===1?'pop':''} ${!canPay?'disabled':''}`}
            onClick={() => canPay && !loadingPkg && buyTokens(pkg, i)} disabled={!!loadingPkg}>
            {i===1 && <div className="pkg-badge">Популярный</div>}
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div>
                <div style={{fontWeight:800,fontSize:18,display:'flex',alignItems:'center',gap:8}}><Icon name="coins" size={18} color="var(--accent-2)"/> {fmt(pkg.tokens)} токенов</div>
                <div style={{fontSize:13,color:'var(--txt2)',marginTop:2}}>~{Math.floor(pkg.tokens/0.5)} слов</div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontWeight:800,fontSize:18,color: canPay?'var(--accent-2)':'var(--txt2)'}}>
                  {isLoading ? <span className="spinner-sm" style={{borderTopColor:'var(--accent-2)'}}/> : `${fmt(pkg.tenge)} ₸`}
                </div>
                {!canPay && <div style={{fontSize:11,color:'var(--err)'}}>Мало средств</div>}
              </div>
            </div>
          </button>
        );
      })}
    </div>
  );
}

// ── RentalScreen (аренда ИИ-аккаунтов) ───────────────────────────────────────
function RentalSheet({ service, user, onClose, onPurchased, onNav, onBalanceUpdate, showToast }) {
  const [open, setOpen]   = useState(false);
  const [tariff, setTariff] = useState(service.tariffs?.[0] || null);
  const [loading, setLoading] = useState(false);
  const [result, setResult]   = useState(null);  // креды после покупки
  const [useBonus, setUseBonus] = useState(true);
  const bonusBal = Number(user?.bonus_balance || 0);
  const reqIdRef = useRef(null);

  useEffect(() => { requestAnimationFrame(() => setOpen(true)); }, []);
  const close = () => { setOpen(false); setTimeout(onClose, 300); };

  const buy = async () => {
    if (!tariff || loading) return;
    const balance   = Number(user?.tenge_balance || 0);
    const spendable = balance + (useBonus ? bonusBal : 0);
    if (spendable < tariff.price) {
      showToast(`Нужно ${fmt(tariff.price)} ₸, у вас ${fmt(spendable)} ₸`);
      close();
      setTimeout(() => onNav('wallet'), 350);
      return;
    }
    setLoading(true);
    if (!reqIdRef.current) {
      reqIdRef.current = (crypto.randomUUID && crypto.randomUUID()) ||
        (Date.now() + '-' + Math.random().toString(36).slice(2));
    }
    try {
      const res = await api('/api/rental/order', { method:'POST', body: JSON.stringify({
        service_id: service.id, tariff_id: tariff.id, request_id: reqIdRef.current, use_bonus: useBonus,
      })});
      reqIdRef.current = null;
      setResult(res);
      onBalanceUpdate && onBalanceUpdate({ tenge_balance: res.balance, bonus_balance: res.bonus_balance });
      onPurchased && onPurchased();
    } catch(e) {
      showToast(e.message);      // ключ сохраняем — ретрай дедуплицируется
      if (/закончились/.test(e.message)) { onPurchased && onPurchased(); close(); }
    } finally {
      setLoading(false);
    }
  };

  const copy = (v, label) => navigator.clipboard?.writeText(v).then(() => showToast(label + ' скопирован'));

  return (
    <>
      <div className={`sheet-dim ${open?'open':''}`} onClick={close}/>
      <div className={`sheet ${open?'open':''}`}>
        <div className="sheet-grip"/>
        {result ? (
          <>
            <div style={{textAlign:'center',marginBottom:18}}>
              <div className="ico-badge" style={{background:'var(--ok-bg)',color:'var(--ok)'}}>{React.cloneElement(ICONS.checkc,{width:30,height:30})}</div>
              <h3 style={{fontSize:19,marginBottom:4}}>{result.service_name || service.name} — ваш!</h3>
              <p>Доступ до {parseUTC(result.expires_at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} · осталось <Countdown expiresAt={result.expires_at}/></p>
            </div>
            <div className="cred-row">
              <div style={{minWidth:0}}>
                <div className="cred-lbl">Email для входа</div>
                <div className="cred-val">{result.email}</div>
              </div>
              <button className="btn-sm btn-sm-blue" onClick={() => copy(result.email,'Email')}>{React.cloneElement(ICONS.copy,{width:15,height:15})}</button>
            </div>
            <p style={{fontSize:12,marginTop:10,marginBottom:14}}>Войдите на сервисе с этим email — код придёт на почту. Запросить код можно в разделе «Аренда» → «Мои аренды».</p>
            <button className="btn btn-primary" onClick={close}>Понятно</button>
          </>
        ) : (
          <>
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:6}}>
              <div className="rent-ico"><RentIcon icon={service.icon} size={26}/></div>
              <div>
                <h3 style={{fontSize:18,marginBottom:2}}>{service.name}</h3>
                {service.description && <p style={{fontSize:13}}>{service.description}</p>}
              </div>
            </div>
            <div className="sec-title" style={{marginTop:14}}>Тариф</div>
            {(service.tariffs||[]).map(t => (
              <button key={t.id} className={`tariff-btn ${tariff?.id===t.id?'on':''}`} onClick={() => setTariff(t)}>
                <div style={{textAlign:'left'}}>
                  <div style={{fontWeight:700,fontSize:15}}>{t.name}</div>
                  <div style={{fontSize:12,color:'var(--txt2)',marginTop:1}}>{durationLabel(t.duration_hours)}</div>
                </div>
                <div style={{fontWeight:800,fontSize:17,color: tariff?.id===t.id ? 'var(--accent-2)' : 'var(--txt)'}}>{fmt(t.price)} ₸</div>
              </button>
            ))}
            {bonusBal > 0 && (
              <div className="adm-row" style={{marginTop:12,marginBottom:0,justifyContent:'space-between'}}>
                <span style={{fontSize:13}}>Списать бонусы ({fmt(bonusBal)} ₸)</span>
                <button className={`toggle ${useBonus?'on':''}`} onClick={()=>setUseBonus(v=>!v)}/>
              </div>
            )}
            <button className="btn btn-primary" style={{marginTop:12,display:'flex',alignItems:'center',justifyContent:'center',gap:8}}
              onClick={buy} disabled={!tariff || loading}>
              {loading ? <><span className="spinner-sm"/> Оформляю…</> : <>Арендовать за {fmt(tariff?.price||0)} ₸</>}
            </button>
            <p style={{fontSize:12,textAlign:'center',marginTop:10}}>Аккаунт выдаётся мгновенно. Баланс: {fmt(user?.tenge_balance)} ₸</p>
          </>
        )}
      </div>
    </>
  );
}

const OTP_COOLDOWN_SEC = 30;

function OtpButton({ email, showToast }) {
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);   // {kind:'code',code} | {kind:'link',magic_link,expires_at}
  const [cooldown, setCooldown] = useState(0);
  const [, forceTick] = useState(0);            // тикает раз в сек, пока показана ссылка — чтобы linkExpired ниже пересчитывался

  useEffect(() => {
    if (cooldown <= 0) return;
    const t = setInterval(() => setCooldown(c => c > 0 ? c - 1 : 0), 1000);
    return () => clearInterval(t);
  }, [cooldown > 0]);

  useEffect(() => {
    if (result?.kind !== 'link') return;
    const t = setInterval(() => forceTick(x => x + 1), 1000);
    return () => clearInterval(t);
  }, [result?.kind === 'link']);

  const getCode = async () => {
    if (loading || cooldown > 0) return;
    setLoading(true);
    try {
      const res = await api(`/api/rental/otp?email=${encodeURIComponent(email)}`);
      if (res.ok && (res.code || res.magic_link)) {
        setResult(res);
        navigator.vibrate?.(30);
      } else {
        showToast(res.message || 'Код ещё не пришёл, попробуйте через несколько секунд');
      }
    } catch(e) {
      showToast(e.message);
    } finally {
      setLoading(false);
      setCooldown(OTP_COOLDOWN_SEC);
    }
  };

  const copy = (v, label) => v && navigator.clipboard?.writeText(v).then(() => showToast(label + ' скопирован'));
  const openLink = (url) => tg?.openLink ? tg.openLink(url) : window.open(url, '_blank');
  const linkExpired = result?.kind === 'link' && parseUTC(result.expires_at) - Date.now() <= 0;

  return (
    <div style={{marginTop:10}} onClick={e => e.stopPropagation()}>
      {result?.kind === 'code' && (
        <div className="cred-row">
          <div style={{minWidth:0}}>
            <div className="cred-lbl">Код входа</div>
            <div className="cred-val" style={{fontSize:20,letterSpacing:2,fontWeight:800}}>{result.code}</div>
          </div>
          <button className="btn-sm btn-sm-blue" onClick={() => copy(result.code, 'Код')}>{React.cloneElement(ICONS.copy,{width:15,height:15})}</button>
        </div>
      )}
      {result?.kind === 'link' && (
        <div className="cred-row" style={{flexDirection:'column',alignItems:'stretch',gap:8}}>
          <div>
            <div className="cred-lbl">Ссылка для входа</div>
            <div className="cred-val" style={{fontSize:12,fontWeight:500,lineHeight:1.4}}>{result.magic_link}</div>
          </div>
          <div style={{display:'flex',gap:8}}>
            <button className="btn-sm btn-sm-blue" style={{flex:1}} onClick={() => copy(result.magic_link, 'Ссылка')}>Копировать</button>
            <button className="btn-sm" style={{flex:1,background:'var(--accent)',color:'#fff'}} onClick={() => openLink(result.magic_link)}>Открыть</button>
          </div>
          <div style={{fontSize:11,color:'var(--txt2)'}}>
            {linkExpired
              ? 'Ссылка истекла — запросите новую'
              : <>Действует ещё <Countdown expiresAt={result.expires_at}/> · потом запросите новую</>}
          </div>
        </div>
      )}
      <button className="btn btn-secondary" style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'center',gap:8,marginTop: result ? 8 : 0}}
        onClick={getCode} disabled={loading || cooldown > 0}>
        {loading
          ? <><span className="spinner-sm" style={{borderTopColor:'var(--accent-2)'}}/> Запрашиваю…</>
          : cooldown > 0
            ? `Повторить через ${cooldown}с`
            : <>{React.cloneElement(ICONS.key,{width:15,height:15})} {result ? 'Обновить' : 'Получить код'}</>}
      </button>
    </div>
  );
}

function RentalScreen({ user, onNav, onBalanceUpdate }) {
  const [toast, showToast] = useToast();
  const [services, setServices] = useState(null);
  const [rentals,  setRentals]  = useState([]);
  const [q,   setQ]   = useState('');
  const [sel, setSel] = useState(null);          // сервис в шите покупки
  const [expanded, setExpanded] = useState({});  // rental_id → bool

  const refresh = useCallback(async () => {
    try {
      const [svc, my] = await Promise.all([api('/api/rental/services'), api('/api/rental/my')]);
      setServices(svc.services || []);
      setRentals([...(my.active || []), ...(my.history || [])]);
    } catch(e) { showToast('Ошибка загрузки: ' + e.message); setServices([]); }
  }, []);
  useEffect(() => { refresh(); }, []);

  const notify = async (svc) => {
    try {
      await api('/api/rental/notify', { method:'POST', body: JSON.stringify({ service_id: svc.id }) });
      showToast('Сообщим, как только освободится');
      refresh();
    } catch(e) { showToast(e.message); }
  };

  const copy = (v, label) => navigator.clipboard?.writeText(v).then(() => showToast(label + ' скопирован'));

  const active  = rentals.filter(r => r.status === 'active');
  const history = rentals.filter(r => r.status !== 'active').slice(0, 5);
  const ql = q.trim().toLowerCase();
  const filtered = (services || []).filter(s =>
    !ql || s.name.toLowerCase().includes(ql) || (s.description||'').toLowerCase().includes(ql));

  return (
    <div className="screen">
      <Toast msg={toast}/>
      <button className="back-btn" onClick={() => onNav('home')}>{ICONS.back} Назад</button>
      <h2 style={{marginBottom:4}}>Аренда ИИ</h2>
      <p style={{marginBottom:16}}>Премиум-аккаунты с мгновенной выдачей</p>

      {active.length > 0 && <>
        <div className="sec-title">Мои аренды</div>
        {active.map(r => (
          <div key={r.id} className="card" style={{padding:16}}>
            <div style={{display:'flex',alignItems:'center',gap:12,cursor:'pointer'}} onClick={() => setExpanded(p => ({...p,[r.id]:!p[r.id]}))}>
              <div className="rent-ico"><RentIcon icon={r.icon} size={24}/></div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:15}}>{r.service_name}</div>
                <div style={{fontSize:12,color:'var(--txt2)',marginTop:1}}>{r.tariff_name}</div>
              </div>
              <div style={{textAlign:'right'}}>
                <Countdown expiresAt={r.expires_at}/>
                <div style={{fontSize:11,color:'var(--txt2)',marginTop:1}}>осталось</div>
              </div>
            </div>
            {expanded[r.id] && <div style={{marginTop:12}}>
              <div className="cred-row" style={{marginBottom:0}}>
                <div style={{minWidth:0}}><div className="cred-lbl">Email для входа</div><div className="cred-val">{r.email}</div></div>
                <button className="btn-sm btn-sm-blue" onClick={(e) => { e.stopPropagation(); copy(r.email,'Email'); }}>{React.cloneElement(ICONS.copy,{width:15,height:15})}</button>
              </div>
              <OtpButton email={r.email} showToast={showToast}/>
            </div>}
          </div>
        ))}
      </>}

      <div className="sec-title">Каталог</div>
      {(services || []).length > 4 && (
        <div className="search-row">
          {ICONS.search}
          <input placeholder="Поиск по названию сервиса" value={q} onChange={e => setQ(e.target.value)}/>
        </div>
      )}
      {services === null && <Spinner/>}
      {services !== null && filtered.length === 0 && <p className="empty">{ql ? 'Ничего не найдено' : 'Каталог скоро пополнится'}</p>}
      {filtered.map(s => {
        const free = s.available > 0;
        const minPrice = Math.min(...s.tariffs.map(t => t.price));
        const minT = s.tariffs.find(t => t.price === minPrice);
        return (
          <button key={s.id} className="svc-card" style={{alignItems:'flex-start'}} onClick={() => free ? setSel(s) : notify(s)}>
            <div className="rent-ico"><RentIcon icon={s.icon} size={24}/></div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,fontSize:16}}>{s.name}</div>
              {s.description && <div style={{fontSize:12,color:'var(--txt2)',marginTop:2,lineHeight:1.45}}>{s.description}</div>}
              <div style={{marginTop:8,display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                {free
                  ? <span className="avail avail-on">Свободно: {s.available}</span>
                  : <span className="avail avail-off">Нет в наличии</span>}
                {!free && s.waiting > 0 && <span className="avail avail-wait">{s.waiting} ждут</span>}
                {!free && <span style={{fontSize:12,fontWeight:700,color:'var(--accent-2)',display:'inline-flex',alignItems:'center',gap:5}}>{React.cloneElement(ICONS.bell,{width:13,height:13})} Уведомить</span>}
              </div>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              <div style={{fontWeight:800,fontSize:17,color:'var(--accent-2)'}}>{fmt(minPrice)} ₸</div>
              <div style={{fontSize:11,color:'var(--txt2)',marginTop:1}}>за {minT ? durationLabel(minT.duration_hours) : '—'}</div>
            </div>
          </button>
        );
      })}

      {history.length > 0 && <>
        <div className="sec-title" style={{marginTop:14}}>История</div>
        {history.map(r => (
          <div key={r.id} className="order-row">
            <div className="rent-ico" style={{width:36,height:36,borderRadius:10}}><RentIcon icon={r.icon} size={18}/></div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,fontSize:14}}>{r.service_name}</div>
              <div className="order-meta">{r.tariff_name} · {fmt(r.amount_tenge)} ₸</div>
            </div>
            {statusTag(r.status)}
          </div>
        ))}
      </>}

      {sel && <RentalSheet service={sel} user={user} showToast={showToast}
        onClose={() => setSel(null)} onPurchased={refresh}
        onNav={onNav} onBalanceUpdate={onBalanceUpdate}/>}
    </div>
  );
}
